name: Build Installers

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install -r installer/requirements.txt

      - name: Build .exe
        working-directory: installer
        run: pyinstaller --distpath .. installer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-installer-windows
          path: job-tracker-installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip3 install -r installer/requirements.txt

      - name: Build binary
        working-directory: installer
        run: pyinstaller --distpath .. installer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-installer-macos
          path: job-tracker-installer

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps + tkinter
        run: |
          sudo apt-get install -y python3-tk
          pip install -r installer/requirements.txt

      - name: Build binary
        working-directory: installer
        run: pyinstaller --distpath .. installer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-installer-linux
          path: job-tracker-installer

  release:
    name: Publish Latest Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: job-tracker-installer-windows
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: job-tracker-installer-macos
          path: dist/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: job-tracker-installer-linux
          path: dist/linux

      - name: Stage release assets
        run: |
          cp dist/windows/job-tracker-installer.exe job-tracker-installer.exe
          cp dist/macos/job-tracker-installer job-tracker-installer-macos
          cp dist/linux/job-tracker-installer job-tracker-installer-linux
          chmod +x job-tracker-installer-macos job-tracker-installer-linux

      - name: Move latest tag to HEAD
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f latest
          git push origin latest --force

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: false
          make_latest: true
          files: |
            job-tracker-installer.exe
            job-tracker-installer-macos
            job-tracker-installer-linux
