name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install -r installer/requirements.txt

      - name: Build .exe
        working-directory: installer
        run: pyinstaller --distpath .. installer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-installer-windows
          path: job-tracker-installer.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: job-tracker-installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip3 install -r installer/requirements.txt

      - name: Build binary
        working-directory: installer
        run: pyinstaller --distpath .. installer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-installer-macos
          path: job-tracker-installer

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: job-tracker-installer

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps + tkinter
        run: |
          sudo apt-get install -y python3-tk
          pip install -r installer/requirements.txt

      - name: Build binary
        working-directory: installer
        run: pyinstaller --distpath .. installer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-installer-linux
          path: job-tracker-installer

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: job-tracker-installer
